<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Feliz Día del Trabajador - PolyfanTech</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;700&family=Playfair+Display:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
    
    <style>
        body {
            background-color: #050505; /* Fondo ultra oscuro para el body */
            margin: 0;
            overflow: hidden;
        }

        .font-serif {
            font-family: 'Playfair Display', serif;
        }
        
        .font-sans {
            font-family: 'Montserrat', sans-serif;
        }

        /* Efecto de texto dorado premium */
        .text-gold {
            background: linear-gradient(to right, #bf953f, #fcf6ba, #b38728, #fbf5b7, #aa771c);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            text-shadow: 0px 4px 20px rgba(179, 135, 40, 0.2);
        }

        /* Brillo sutil de fondo */
        .bg-glow {
            position: absolute;
            width: 150%;
            height: 150%;
            background: radial-gradient(circle, rgba(179,135,40,0.08) 0%, rgba(0,0,0,0) 60%);
            top: -25%;
            left: -25%;
            animation: pulse-glow 8s infinite alternate ease-in-out;
            pointer-events: none;
        }

        @keyframes pulse-glow {
            0% { transform: scale(0.9) translate(0, 0); }
            100% { transform: scale(1.1) translate(2%, 2%); }
        }

        /* Fondo dinámico animado */
        .bg-dynamic {
            background-image: radial-gradient(circle at center, #1a1a1d 0%, #000000 100%);
            animation: bgZoom 15s ease-out forwards;
        }

        @keyframes bgZoom {
            from { background-size: 100% 100%; }
            to { background-size: 120% 120%; }
        }

        /* Transiciones iniciales personalizadas para asegurar que los elementos arranquen invisibles */
        .scene {
            opacity: 0;
            transform: translateY(20px);
            transition: opacity 1.5s ease-out, transform 1.5s ease-out;
            position: absolute;
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        .scene.active {
            opacity: 1;
            transform: translateY(0);
        }

        .scene.fade-up {
            opacity: 0;
            transform: translateY(-20px);
        }

        /* Línea separadora decorativa */
        .gold-line {
            width: 0px;
            height: 1px;
            background: linear-gradient(to right, transparent, #bf953f, transparent);
            transition: width 2s ease-out;
            margin: 20px auto;
        }
        
        .active .gold-line {
            width: 300px;
        }

        /* Animación del botón de reinicio */
        .replay-btn {
            opacity: 0;
            transition: opacity 1s ease-in;
            pointer-events: none;
        }
        .replay-btn.visible {
            opacity: 0.5;
            pointer-events: auto;
        }
        .replay-btn:hover {
            opacity: 1;
        }
    </style>
</head>
<body class="flex items-center justify-center min-h-screen text-white">

    <!-- Contenedor estricto 16:9 -->
    <div class="relative w-full max-w-6xl aspect-video bg-dynamic overflow-hidden rounded-xl shadow-[0_0_50px_rgba(0,0,0,0.8)] border border-gray-800/50">
        
        <!-- Efecto de luz de fondo -->
        <div class="bg-glow"></div>

        <!-- ESCENA 1: Introducción -->
        <div id="scene1" class="scene h-full z-10 px-4 md:px-8 text-center max-w-4xl mx-auto">
            <p class="font-sans text-base sm:text-lg md:text-xl lg:text-2xl font-light tracking-wide text-gray-300 leading-relaxed">
                Hoy honramos el esfuerzo, la pasión y la perseverancia de cada trabajador...
            </p>
            <p id="scene1-part2" class="font-sans text-base sm:text-lg md:text-xl lg:text-2xl font-light tracking-wide text-gray-300 mt-3 md:mt-4 opacity-0 transition-opacity duration-1000 leading-relaxed">
                porque son sus manos y su dedicación las que verdaderamente construyen y transforman nuestro mundo todos los días.
            </p>
        </div>

        <!-- ESCENA 2: Mensaje Principal -->
        <div id="scene2" class="scene h-full z-20 px-4 md:px-8 text-center flex-col justify-center pointer-events-none">
            <h2 class="font-sans text-xs sm:text-sm md:text-lg tracking-[0.2em] md:tracking-[0.3em] uppercase text-gray-400 mb-4 md:mb-6">
                Celebramos tu esfuerzo
            </h2>
            <h1 class="font-serif text-3xl sm:text-5xl md:text-7xl lg:text-8xl font-semibold text-gold leading-tight">
                ¡Feliz Día <br>del Trabajador!
            </h1>
            <div class="gold-line"></div>
        </div>

        <!-- ESCENA 3: Firma (PolyfanTech) -->
        <div id="scene3" class="absolute bottom-6 md:bottom-10 w-full flex flex-col items-center z-30 opacity-0 translate-y-10 transition-all duration-1000 ease-out">
            <p class="font-sans text-xs sm:text-sm md:text-base font-medium text-gray-400 tracking-wide mb-2 md:mb-3">
                De parte de
            </p>
            <img src="https://i.imgur.com/5Zjf9pg.png" alt="PolyfanTech" class="h-6 sm:h-8 md:h-11 object-contain">
        </div>

        <!-- Botón para repetir la animación -->
        <button id="replay" class="replay-btn absolute top-4 right-4 md:top-6 md:right-6 text-gray-400 hover:text-white transition-colors z-40 focus:outline-none flex items-center gap-1 md:gap-2 text-xs md:text-sm font-sans tracking-widest uppercase">
            <svg class="w-3 h-3 md:w-4 md:h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"></path></svg>
            <span class="hidden sm:inline">Repetir</span>
        </button>

    </div>

    <!-- Lógica de la animación -->
    <script>
        const scene1 = document.getElementById('scene1');
        const scene1Part2 = document.getElementById('scene1-part2');
        const scene2 = document.getElementById('scene2');
        const scene3 = document.getElementById('scene3');
        const replayBtn = document.getElementById('replay');
        
        let timelineTimeouts = [];

        function startAnimation() {
            // Limpiar timeouts y clases previas en caso de reinicio
            timelineTimeouts.forEach(clearTimeout);
            timelineTimeouts = [];
            
            scene1.className = 'scene h-full z-10 px-4 md:px-8 text-center max-w-4xl mx-auto';
            scene1Part2.classList.replace('opacity-100', 'opacity-0');
            scene2.className = 'scene h-full z-20 px-4 md:px-8 text-center flex-col justify-center pointer-events-none';
            scene3.className = 'absolute bottom-6 md:bottom-10 w-full flex flex-col items-center z-30 opacity-0 translate-y-10 transition-all duration-1000 ease-out';
            replayBtn.classList.remove('visible');

            // --- TIMELINE DE LA ANIMACIÓN (Total: 10 segundos) ---
            
            // 0.5s: Aparece primera frase
            timelineTimeouts.push(setTimeout(() => {
                scene1.classList.add('active');
            }, 500));

            // 2.5s: Aparece segunda parte de la primera frase
            timelineTimeouts.push(setTimeout(() => {
                scene1Part2.classList.replace('opacity-0', 'opacity-100');
            }, 2500));

            // 5.5s: Desaparece Escena 1 (sube y se desvanece)
            timelineTimeouts.push(setTimeout(() => {
                scene1.classList.remove('active');
                scene1.classList.add('fade-up');
            }, 5500));

            // 6.5s: Aparece Escena 2 (Título Principal)
            timelineTimeouts.push(setTimeout(() => {
                scene2.classList.add('active');
            }, 6500));

            // 8.0s: Aparece Escena 3 (Mensaje "De parte de" y Logo)
            timelineTimeouts.push(setTimeout(() => {
                scene3.classList.remove('opacity-0', 'translate-y-10');
                scene3.classList.add('opacity-100', 'translate-y-0');
            }, 8000));

            // 10.0s: Mostrar botón de repetición (Fin exacto a los 10s)
            timelineTimeouts.push(setTimeout(() => {
                replayBtn.classList.add('visible');
            }, 10000));
        }

        // Iniciar al cargar
        window.onload = startAnimation;

        // Botón de reinicio
        replayBtn.addEventListener('click', startAnimation);

    </script>
</body>
</html>
